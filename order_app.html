<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한스코퍼레이션 공기구 주문</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.20.2/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f0f2f5;color:#222;min-height:100vh}

/* 헤더 */
#hdr{position:sticky;top:0;z-index:100;background:#1a3a5c;color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;height:56px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#hdr .logo{font-size:17px;font-weight:700;white-space:nowrap;letter-spacing:-.5px;cursor:pointer;user-select:none}
#hdr .logo span{color:#f0c040}
#search-wrap{flex:1;display:flex;align-items:center;background:rgba(255,255,255,.15);border-radius:8px;padding:0 12px;max-width:480px}
#search-wrap svg{opacity:.7;flex-shrink:0}
#q{background:none;border:none;outline:none;color:#fff;font-size:14px;padding:8px 8px;flex:1;min-width:0}
#q::placeholder{color:rgba(255,255,255,.55)}
#btn-clear-q{background:none;border:none;color:rgba(255,255,255,.6);cursor:pointer;font-size:16px;display:none;padding:0 2px}
#cart-btn{position:relative;background:#f0c040;border:none;border-radius:8px;cursor:pointer;padding:8px 14px;font-weight:700;font-size:13px;color:#1a3a5c;display:flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0}
#cart-badge{background:#e84040;color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 6px;min-width:20px;text-align:center;display:none}

/* 브랜드 필터 바 */
#filter-bar{background:#fff;border-bottom:1px solid #e0e4ea;padding:10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:56px;z-index:90}
#filter-bar .fb-label{font-size:12px;color:#666;white-space:nowrap;font-weight:600}
.brand-chip{border:1px solid #d0d4da;background:#fff;border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
.brand-chip:hover{border-color:#2456a4;color:#2456a4}
.brand-chip.active{background:#2456a4;border-color:#2456a4;color:#fff;font-weight:600}

/* 컨텐츠 */
#content{padding:16px}
#items-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
#items-count{font-size:13px;color:#666}
#sort-sel{border:1px solid #d0d4da;border-radius:6px;padding:6px 10px;font-size:13px;outline:none;background:#fff}

/* 상품 그리드 */
#prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.pcard{background:#fff;border:1px solid #e0e4ea;border-radius:12px;overflow:hidden;cursor:pointer;transition:all .15s;display:flex;flex-direction:column}
.pcard:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.1);border-color:#2456a4}
.pcard-img{width:100%;aspect-ratio:1;object-fit:contain;padding:12px;background:#fafafa;border-bottom:1px solid #f0f2f5}
.pcard-img-err{width:100%;aspect-ratio:1;display:none;align-items:center;justify-content:center;font-size:36px;color:#ccc;background:#fafafa;border-bottom:1px solid #f0f2f5}
.pcard-body{padding:10px;flex:1;display:flex;flex-direction:column;gap:4px}
.pcard-brand{font-size:11px;color:#888}
.pcard-name{font-size:12px;line-height:1.4;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-weight:600}
.pcard-spec{font-size:11px;color:#999;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pcard-price{font-size:14px;font-weight:700;color:#2456a4}
.pcard-unit{font-size:11px;color:#555;margin-bottom:2px}
.pcard-btn{margin:0 10px 10px;background:#2456a4;color:#fff;border:none;border-radius:8px;padding:7px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s}
.pcard-btn:hover{background:#1a3a5c}

/* 검색 없음 */
#no-result{display:none;text-align:center;padding:60px 20px;color:#999;font-size:15px}

/* 장바구니 패널 */
#cart-panel{position:fixed;top:0;right:-420px;width:420px;height:100vh;background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.15);z-index:200;display:flex;flex-direction:column;transition:right .3s ease}
#cart-panel.open{right:0}
#cart-hdr{background:#1a3a5c;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
#cart-hdr h2{font-size:16px}
#cart-close{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1}
#cart-body{flex:1;overflow-y:auto;padding:16px}
#cart-empty{text-align:center;padding:60px 20px;color:#999;font-size:14px;display:none}
.citem{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f0f2f5;align-items:flex-start}
.citem-img{width:52px;height:52px;object-fit:contain;border:1px solid #eee;border-radius:6px;flex-shrink:0;background:#fafafa}
.citem-info{flex:1;min-width:0}
.citem-name{font-size:12px;line-height:1.4;margin-bottom:2px;font-weight:600}
.citem-spec{font-size:11px;color:#999;margin-bottom:3px}
.citem-price{font-size:13px;font-weight:700;color:#2456a4}
.citem-ctrl{display:flex;align-items:center;gap:6px;margin-top:6px}
.qty-btn{width:26px;height:26px;border:1px solid #d0d4da;border-radius:6px;background:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}
.qty-btn:hover{background:#f0f2f5}
.qty-val{min-width:32px;text-align:center;font-size:13px;font-weight:600}
.citem-del{margin-left:auto;background:none;border:none;color:#ccc;font-size:18px;cursor:pointer;line-height:1}
.citem-del:hover{color:#e84040}
#cart-footer{padding:16px;border-top:2px solid #f0f2f5;background:#fafafa}
.total-row{display:flex;justify-content:space-between;font-size:15px;font-weight:700;margin-bottom:12px}
.total-row span:last-child{color:#2456a4;font-size:17px}
.cart-actions{display:flex;gap:8px}
.cart-actions button{flex:1;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
#btn-clear-cart{background:#f0f2f5;color:#555}
#btn-export{background:#2456a4;color:#fff}
#btn-export:hover{background:#1a3a5c}

/* 상품 모달 */
#modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:center;justify-content:center}
#modal-bg.open{display:flex}
#modal{background:#fff;border-radius:16px;max-width:480px;width:90%;max-height:85vh;overflow-y:auto;padding:24px}
#modal-close{float:right;background:none;border:none;font-size:22px;cursor:pointer;color:#666;margin-top:-4px}
#modal-img{width:200px;height:200px;object-fit:contain;border:1px solid #eee;border-radius:8px;display:block;margin:12px auto;background:#fafafa}
#modal-brand{font-size:12px;color:#888;margin-bottom:4px}
#modal-name{font-size:18px;font-weight:700;margin-bottom:6px}
#modal-spec{font-size:13px;color:#666;margin-bottom:4px}
#modal-code{font-size:11px;color:#aaa;margin-bottom:16px}
#modal-price-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:12px;background:#f0f4ff;border-radius:8px}
#modal-price{font-size:22px;font-weight:700;color:#2456a4}
#modal-unit{font-size:13px;color:#555}
.modal-qty-wrap{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.modal-qty-wrap label{font-size:13px;color:#555;min-width:40px}
.modal-qty-wrap .qty-btn{width:32px;height:32px}
#modal-qty{width:60px;text-align:center;border:1px solid #d0d4da;border-radius:8px;padding:6px;font-size:15px;font-weight:700}
#modal-add-btn{width:100%;padding:13px;background:#2456a4;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
#modal-add-btn:hover{background:#1a3a5c}

/* 관리자 모달 */
#admin-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;align-items:center;justify-content:center}
#admin-modal.open{display:flex}
#admin-box{background:#fff;border-radius:12px;padding:24px;width:300px}
#admin-box h3{font-size:16px;font-weight:700;margin-bottom:16px}
#admin-box label{font-size:13px;color:#555;display:block;margin-bottom:6px}
#admin-margin{width:100%;border:1px solid #d0d4da;border-radius:8px;padding:8px 12px;font-size:16px;text-align:center;outline:none}
.admin-actions{display:flex;gap:8px;margin-top:16px}
.admin-actions button{flex:1;padding:10px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
#admin-cancel{background:#f0f2f5;color:#555}
#admin-save{background:#2456a4;color:#fff}

/* 오버레이 */
#overlay{display:none;position:fixed;inset:0;z-index:150}
#overlay.open{display:block}

@media(max-width:600px){
  #prod-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  #cart-panel{width:100%}
}
</style>
</head>

<!-- 헤더 -->
<div id="hdr">
  <div class="logo" id="logo">한스<span>코퍼레이션</span></div>
  <div id="search-wrap">
    <svg width="16" height="16" fill="none" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke="white" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" type="text" placeholder="품명, 브랜드, 규격 검색..." autocomplete="off">
    <button id="btn-clear-q" onclick="clearQ()">✕</button>
  </div>
  <button id="cart-btn" onclick="toggleCart()">
    🛒 장바구니
    <span id="cart-badge">0</span>
  </button>
</div>

<!-- 브랜드 필터 -->
<div id="filter-bar">
  <span class="fb-label">브랜드</span>
  <div id="brand-chips"></div>
</div>

<!-- 컨텐츠 -->
<div id="content">
  <div id="items-header">
    <span id="items-count"></span>
    <select id="sort-sel" onchange="renderGrid()">
      <option value="no">기본순</option>
      <option value="name">이름순</option>
      <option value="price-asc">가격 낮은순</option>
      <option value="price-desc">가격 높은순</option>
    </select>
  </div>
  <div id="prod-grid"></div>
  <div id="no-result">🔍 검색 결과가 없습니다.</div>
</div>

<!-- 장바구니 오버레이 -->
<div id="overlay" onclick="closeCart()"></div>

<!-- 장바구니 패널 -->
<div id="cart-panel">
  <div id="cart-hdr">
    <h2>🛒 장바구니</h2>
    <button id="cart-close" onclick="closeCart()">✕</button>
  </div>
  <div id="cart-body">
    <div id="cart-empty">장바구니가 비어 있습니다.</div>
  </div>
  <div id="cart-footer">
    <div class="total-row"><span>합계</span><span id="cart-total">₩0</span></div>
    <div class="cart-actions">
      <button id="btn-clear-cart" onclick="clearCart()">전체삭제</button>
      <button id="btn-export" onclick="exportExcel()">📋 견적서 출력</button>
    </div>
  </div>
</div>

<!-- 상품 모달 -->
<div id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div id="modal">
    <button id="modal-close" onclick="closeModal()">✕</button>
    <img id="modal-img" src="" alt="">
    <div id="modal-brand"></div>
    <div id="modal-name"></div>
    <div id="modal-spec"></div>
    <div id="modal-code"></div>
    <div id="modal-price-row">
      <div id="modal-price"></div>
      <div id="modal-unit"></div>
    </div>
    <div class="modal-qty-wrap">
      <label>수량</label>
      <button class="qty-btn" onclick="mQty(-1)">−</button>
      <input id="modal-qty" type="number" value="1" min="1">
      <button class="qty-btn" onclick="mQty(1)">+</button>
    </div>
    <button id="modal-add-btn" onclick="addFromModal()">장바구니 담기</button>
  </div>
</div>

<!-- 관리자 모달 -->
<div id="admin-modal">
  <div id="admin-box">
    <h3>🔧 관리자 설정</h3>
    <label>마진율 (%)</label>
    <input id="admin-margin" type="number" min="0" max="300" step="0.1" placeholder="30">
    <div class="admin-actions">
      <button id="admin-cancel" onclick="closeAdmin()">취소</button>
      <button id="admin-save" onclick="saveAdminMargin()">저장</button>
    </div>
  </div>
</div>

// ── 상태 ──────────────────────────────────────────────────────
let state = { q:'', brand:'전체', modalCode:null };
let cart = {};  // code → {item, qty}

// ── 브랜드 목록 ──────────────────────────────────────────────
const brands = ['전체', ...new Set(ITEMS.map(i => i.brand))];
function buildBrandChips() {
  const wrap = document.getElementById('brand-chips');
  wrap.innerHTML = brands.map(b =>
    `<span class="brand-chip${b==='전체'?' active':''}" onclick="selectBrand('${b}')">${b}</span>`
  ).join('');
}
function selectBrand(b) {
  state.brand = b;
  document.querySelectorAll('.brand-chip').forEach(el => {
    el.classList.toggle('active', el.textContent === b);
  });
  renderGrid();
}

// ── 필터링 ──────────────────────────────────────────────────
function getFiltered() {
  const q = state.q.toLowerCase().trim();
  return ITEMS.filter(it => {
    if (state.brand !== '전체' && it.brand !== state.brand) return false;
    if (q) {
      const hay = (it.name+' '+it.brand+' '+it.spec+' '+it.code).toLowerCase();
      return q.split(/\s+/).every(w => hay.includes(w));
    }
    return true;
  });
}

// ── 정렬 ──────────────────────────────────────────────────
function getSorted(items) {
  const s = document.getElementById('sort-sel').value;
  return [...items].sort((a,b) => {
    if (s==='name') return a.name.localeCompare(b.name);
    if (s==='price-asc') return a.price - b.price;
    if (s==='price-desc') return b.price - a.price;
    return a.no - b.no;
  });
}

// ── 그리드 렌더링 ──────────────────────────────────────────
function renderGrid() {
  const filtered = getSorted(getFiltered());
  const grid = document.getElementById('prod-grid');
  const noR = document.getElementById('no-result');
  document.getElementById('items-count').textContent = `총 ${filtered.length}개 상품`;

  if (!filtered.length) {
    grid.innerHTML = '';
    noR.style.display = 'block';
    return;
  }
  noR.style.display = 'none';

  grid.innerHTML = filtered.map(it => {
    const imgUrl = IMG_BASE + it.imgId + '-2-3.jpg';
    const sellPrice = mp(it.price);
    return `<div class="pcard" onclick="openModal('${it.code}')">
      <img class="pcard-img" src="${imgUrl}" alt="${it.name}" loading="lazy"
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="pcard-img-err">📦</div>
      <div class="pcard-body">
        <div class="pcard-brand">${it.brand}</div>
        <div class="pcard-name">${it.name}</div>
        <div class="pcard-spec">${it.spec}</div>
        <div class="pcard-price">${fmt(sellPrice)}</div>
        <div class="pcard-unit">/ ${it.unit}</div>
      </div>
      <button class="pcard-btn" onclick="event.stopPropagation();quickAdd('${it.code}')">+ 담기</button>
    </div>`;
  }).join('');
}

// ── 검색 ──────────────────────────────────────────────────
document.getElementById('q').addEventListener('input', e => {
  state.q = e.target.value;
  document.getElementById('btn-clear-q').style.display = state.q ? 'block' : 'none';
  renderGrid();
});
function clearQ() {
  state.q = '';
  document.getElementById('q').value = '';
  document.getElementById('btn-clear-q').style.display = 'none';
  renderGrid();
}

// ── 장바구니 ──────────────────────────────────────────────
function quickAdd(code) {
  if (!cart[code]) cart[code] = { item: ITEMS.find(i=>i.code===code), qty:1 };
  else cart[code].qty++;
  updateCart();
}
function updateCart() {
  const keys = Object.keys(cart);
  const badge = document.getElementById('cart-badge');
  const total = keys.reduce((s,k) => s + cart[k].qty, 0);
  badge.textContent = total;
  badge.style.display = total ? 'inline' : 'none';

  const body = document.getElementById('cart-body');
  const empty = document.getElementById('cart-empty');
  if (!keys.length) {
    body.innerHTML = '';
    body.appendChild(empty);
    empty.style.display = 'block';
    document.getElementById('cart-total').textContent = fmt(0);
    return;
  }
  empty.style.display = 'none';

  let html = '';
  let grandTotal = 0;
  keys.forEach(code => {
    const {item, qty} = cart[code];
    const p = mp(item.price);
    const sub = p * qty;
    grandTotal += sub;
    const imgUrl = IMG_BASE + item.imgId + '-2-3.jpg';
    html += `<div class="citem">
      <img class="citem-img" src="${imgUrl}" alt="" onerror="this.src=''">
      <div class="citem-info">
        <div class="citem-name">${item.name}</div>
        <div class="citem-spec">${item.spec}</div>
        <div class="citem-price">${fmt(p)} / ${item.unit}</div>
        <div class="citem-ctrl">
          <button class="qty-btn" onclick="changeQty('${code}',-1)">−</button>
          <span class="qty-val">${qty}</span>
          <button class="qty-btn" onclick="changeQty('${code}',1)">+</button>
          <span style="margin-left:4px;font-size:12px;color:#888">= ${fmt(sub)}</span>
        </div>
      </div>
      <button class="citem-del" onclick="removeItem('${code}')">🗑</button>
    </div>`;
  });
  body.innerHTML = html;
  document.getElementById('cart-total').textContent = fmt(grandTotal);
}
function changeQty(code, d) {
  if (!cart[code]) return;
  cart[code].qty = Math.max(1, cart[code].qty + d);
  updateCart();
}
function removeItem(code) {
  delete cart[code];
  updateCart();
}
function clearCart() {
  if (!Object.keys(cart).length) return;
  if (!confirm('장바구니를 비우겠습니까?')) return;
  cart = {};
  updateCart();
}
function toggleCart() {
  const panel = document.getElementById('cart-panel');
  const ov = document.getElementById('overlay');
  panel.classList.toggle('open');
  ov.classList.toggle('open');
}
function closeCart() {
  document.getElementById('cart-panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

// ── 모달 ──────────────────────────────────────────────────
function openModal(code) {
  const it = ITEMS.find(i => i.code === code);
  if (!it) return;
  state.modalCode = code;
  const imgUrl = IMG_BASE + it.imgId + '-2-3.jpg';
  const el = document.getElementById('modal-img');
  el.src = imgUrl;
  el.onerror = function(){ this.src=''; this.onerror=null; };
  document.getElementById('modal-brand').textContent = it.brand;
  document.getElementById('modal-name').textContent = it.name;
  document.getElementById('modal-spec').textContent = it.spec;
  document.getElementById('modal-code').textContent = '상품코드: ' + it.code;
  document.getElementById('modal-price').textContent = fmt(mp(it.price));
  document.getElementById('modal-unit').textContent = '/ ' + it.unit;
  document.getElementById('modal-qty').value = cart[code]?.qty || 1;
  document.getElementById('modal-bg').classList.add('open');
}
function closeModal() {
  document.getElementById('modal-bg').classList.remove('open');
  state.modalCode = null;
}
function mQty(d) {
  const el = document.getElementById('modal-qty');
  el.value = Math.max(1, parseInt(el.value||1) + d);
}
function addFromModal() {
  const code = state.modalCode;
  if (!code) return;
  const qty = Math.max(1, parseInt(document.getElementById('modal-qty').value) || 1);
  if (!cart[code]) cart[code] = { item: ITEMS.find(i=>i.code===code), qty };
  else cart[code].qty = qty;
  updateCart();
  closeModal();
  toggleCart();
}

// ── Excel 견적서 출력 ──────────────────────────────────────
function exportExcel() {
  const keys = Object.keys(cart);
  if (!keys.length) { alert('장바구니가 비어 있습니다.'); return; }

  const today = new Date();
  const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  const header = ['No.','상품코드','브랜드','품명','규격','단위','단가','수량','금액'];
  const rows = keys.map((code, i) => {
    const {item, qty} = cart[code];
    const p = mp(item.price);
    return [i+1, item.code, item.brand, item.name, item.spec, item.unit, p, qty, p*qty];
  });
  const total = rows.reduce((s,r) => s + r[8], 0);
  rows.push(['','','','','','','합계','', total]);

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([
    ['한스코퍼레이션 공기구 견적서'],
    [`견적일: ${dateStr}`],
    [],
    header,
    ...rows
  ]);

  // 열 너비
  ws['!cols'] = [{wch:5},{wch:14},{wch:14},{wch:22},{wch:28},{wch:6},{wch:12},{wch:6},{wch:14}];

  XLSX.utils.book_append_sheet(wb, ws, '견적서');
  XLSX.writeFile(wb, `공기구견적서_${dateStr}.xlsx`);
}

// ── 관리자 패널 (로고 5회 클릭) ──────────────────────────
let _logoCnt = 0, _logoTimer;
document.getElementById('logo').addEventListener('click', () => {
  _logoCnt++;
  clearTimeout(_logoTimer);
  _logoTimer = setTimeout(() => _logoCnt=0, 2000);
  if (_logoCnt >= 5) {
    _logoCnt = 0;
    document.getElementById('admin-margin').value = (MARGIN_RATE*100).toFixed(1);
    document.getElementById('admin-modal').style.display = 'flex';
  }
});
function saveAdminMargin() {
  const v = parseFloat(document.getElementById('admin-margin').value);
  if (isNaN(v) || v<0 || v>300) { alert('0~300 사이 숫자를 입력해주세요.'); return; }
  MARGIN_RATE = v / 100;
  localStorage.setItem('hs_margin', MARGIN_RATE.toString());
  closeAdmin();
  renderGrid();
  updateCart();
  alert(`마진율 ${v}%로 저장됐습니다.`);
}
function closeAdmin() { document.getElementById('admin-modal').style.display = 'none'; }

// ── 초기화 ──────────────────────────────────────────────────
buildBrandChips();
renderGrid();
updateCart();
</script>
</body>
</html>
